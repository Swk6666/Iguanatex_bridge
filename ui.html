<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IguanaTex Bridge</title><link rel="stylesheet" href="/shared/workspace.css"><link rel="stylesheet" href="/shared/chat.css">
<style>
body{height:100vh;display:flex;flex-direction:column;overflow:hidden}.file-tools{display:flex;align-items:center;gap:6px}.file-tools button{font-size:12px}#filename{font-size:11px;color:var(--muted);max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.layout{display:flex;flex:1;min-height:0;padding:0 12px;gap:12px;position:relative}.layout .editor-shell{padding:0;min-width:0}.deck-panel{width:210px;flex:none;position:relative;margin:8px 0 10px;border:1px solid var(--line);border-radius:7px;background:#fff;display:flex;flex-direction:column;overflow:hidden}.deck-panel>summary{padding:9px 12px;font-size:12px;font-weight:600;border-bottom:1px solid var(--line)}.deck-panel>summary::before{content:'☰';margin-right:8px;color:var(--muted)}.deck-panel:not([open]){width:36px;height:36px}.deck-panel:not([open])>summary{font-size:0;padding:7px 9px;border:0}.deck-panel:not([open])>summary::before{font-size:15px;margin:0}.deck-content{padding:9px;overflow:auto;flex:1;min-height:0}.deck-content #add{width:100%;font-size:12px}.eq{display:block;text-align:left;width:100%;margin-top:7px;overflow:hidden;border-color:transparent;background:#f6f9f7;font-size:12px}.eq.active{border-color:#6b9e88;background:#ebf4ee}.eq small{display:block;font-size:10px;color:#83938b;margin-top:3px}.deck-content .muted{margin-top:14px;font-size:12px}.file-options button{display:block;width:100%;text-align:left;margin:3px 0}.file-options .popover-content{width:300px}.editor-tools #editing{font-size:12px;font-weight:600;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.preview-canvas .muted{font-size:12px}#previewbox{height:126px}
@media(max-width:1000px){#filename{display:none}.layout{padding:0 8px;gap:8px}.deck-panel{width:170px}.editor-tools #editing{max-width:130px}}
@media(max-width:760px){.app-header .mark,.app-header h1{display:none}.deck-panel{position:absolute;top:0;left:8px;bottom:52px;width:220px;z-index:15;box-shadow:4px 0 20px #193d321a}.deck-panel:not([open]){bottom:auto;box-shadow:none}.layout .editor-tools{padding-left:44px}.file-tools button{font-size:11px;padding:4px 6px}.editor-tools #editing{display:none}}
</style></head>
<body><header class="app-header"><span class="mark" aria-hidden="true">∑</span><h1>IguanaTex <span>Bridge</span></h1><span class="context">独立编辑器</span><div class="file-tools"><button id="open">打开 PPTX</button><input id="file" type="file" accept=".pptx" hidden><button id="new" class="quiet">新建文件</button><button id="save">下载 PPTX</button></div><span class="spacer"></span><span id="filename">未打开文件</span><button id="assistantToggle" aria-controls="assistantDock" aria-expanded="false">AI 助手</button></header>
<div class="layout"><details class="deck-panel" open><summary title="展开或收起公式列表">公式列表</summary><div class="deck-content"><button id="add">＋ 新建公式</button><div id="equations"><p class="muted">打开 PPTX 或新建文件，即可管理其中的公式。</p></div></div></details>
<main class="editor-shell"><div class="editor-tools"><span id="editing">新建公式</span><label>第 <select id="slide" aria-label="目标幻灯片"><option value="1">1</option></select> 页</label><label><span class="tool-label">引擎</span><select id="engine" aria-label="编译引擎"><option>xelatex</option><option>pdflatex</option><option>lualatex</option></select></label><span class="spacer"></span><details class="popover file-options"><summary>更多</summary><div class="popover-content"><button id="sources">导出源码备份</button><button id="protect">同步源码 / 恢复标签</button><button id="doctor">检查 LaTeX 环境</button><h2>使用说明</h2><p class="note">编辑完整 LaTeX 文档；公式片段会先补全并显示。公式在本机编译，写入后需下载新的 PPTX。</p><p class="note">独立编辑器输出透明 PNG。Shape 组合可读取源码，原位更新需先转为 Picture；WPS 工具栏插件可直接更新 Shape。三端 Office 往返仍待实机验证。</p></div></details></div>
<div class="work-area"><div class="formula-pane"><div class="source-head"><label for="source">LaTeX 源码</label><span class="source-caption">.tex · 完整文档</span></div><textarea id="source" spellcheck="false" aria-label="完整 LaTeX 源码">M(q)\ddot{q}+C(q,\dot{q})\dot{q}+g(q)=\tau</textarea><div class="preview-pane"><div class="preview-head"><strong>预览</strong></div><div class="preview-canvas" id="previewbox"><span class="muted">点击预览，检查排版结果</span></div></div></div>
<aside id="assistantDock" class="assistant-dock" aria-label="AI 助手" hidden><div class="dock-heading">AI 助手 <span>DeepSeek</span><span class="spacer"></span><button id="assistantClose" class="quiet icon-button" aria-label="收起 AI 助手">×</button></div><div id="chatPanel"></div></aside></div>
<div class="actionbar"><div id="status" role="status" aria-live="polite">打开或新建 PPTX，即可开始编辑</div><div class="actions"><button id="preview">预览</button><button id="apply" class="primary">写入当前 PPTX</button></div></div>
</main></div>
<script src="/shared/latex.js"></script><script src="/shared/chat.js"></script>
<script>
const token='__TOKEN__';
const $=id=>document.getElementById(id);let equations=[],selected=null,busy=false,unsaved=false,textDirty=false;
function status(t){$('status').textContent=t}
async function api(path,data={}){const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json','X-Bridge-Token':token},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error||r.statusText);return j}
async function run(fn){if(busy||chat.isBusy())return;busy=true;document.querySelectorAll('button,textarea,select').forEach(b=>b.disabled=true);try{await fn()}catch(e){status(e.message)}finally{busy=false;document.querySelectorAll('button,textarea,select').forEach(b=>b.disabled=false);$('slide').disabled=!!selected}}
function discard(){return !(unsaved||textDirty)||confirm('有尚未下载或写入的修改，仍要继续吗？')}
function refresh(data){equations=data.equations;$('filename').textContent=data.name;const old=$('slide').value;$('slide').replaceChildren();for(let i=1;i<=data.slides;i++){$('slide').add(new Option(i,i))}if(Number(old)<=data.slides)$('slide').value=old;renderList()}
function renderList(){$('equations').replaceChildren();for(const eq of equations){const b=document.createElement('button');b.className='eq'+(selected&&selected.slide===eq.slide&&selected.shape_id===eq.shape_id?' active':'');b.textContent=`第 ${eq.slide} 页 · ${eq.name}`;const small=document.createElement('small');small.textContent=eq.origin;b.append(small);b.onclick=()=>{if(textDirty&&!confirm('舍弃编辑区尚未写入的修改？'))return;run(()=>select(eq))};$('equations').append(b)}if(!equations.length){const p=document.createElement('p');p.className='muted';p.textContent='没有找到含源码的公式。普通截图可以通过图片识别转为 LaTeX。';$('equations').append(p)}}
async function select(eq){selected=eq;await IguanaLatex.load($('source'),eq.source,api);$('engine').value=eq.engine;$('slide').value=eq.slide;$('slide').disabled=true;$('editing').textContent='编辑 '+eq.name;textDirty=false;renderList();status(eq.origin==='IguanaTex Tags'?'已读取 IguanaTex 原始源码。修改后点击“写入当前 PPTX”。':'从备份找回源码。请核对公式，再同步标签并下载。')}
function reset(){selected=null;$('slide').disabled=false;$('editing').textContent='新建公式';textDirty=false;renderList()}
function payload(){return{source:$('source').value,engine:$('engine').value,slide:Number($('slide').value),shape_id:selected?.shape_id??null}}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),10000)}
function from64(s){const bin=atob(s),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}
const chat=IguanaChat.mount($('chatPanel'),{api,source:$('source'),collapsed:false,docked:true,canStart:()=>!busy,prepareSource:(source,current)=>IguanaLatex.merge(source,current,api),onSource:()=>textDirty=true});
$('source').oninput=()=>textDirty=true;$('engine').onchange=()=>textDirty=true;
$('open').onclick=()=>{if(discard())$('file').click()};
$('file').onchange=()=>run(async()=>{const f=$('file').files[0];if(!f)return;if(f.size>50000000)throw Error('请选择小于 50 MB 的 PPTX。');const data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(f)});const result=await api('load',{name:f.name,data});reset();refresh(result);unsaved=false;status(`已载入 ${result.slides} 页，找到 ${result.equations.length} 个公式。`);$('file').value=''});
$('new').onclick=()=>{if(discard())run(async()=>{const d=await api('new');reset();refresh(d);unsaved=false;status('已新建一页空白 PPTX。输入公式后写入。')})};
$('add').onclick=()=>{if(!textDirty||confirm('舍弃编辑区尚未写入的修改？'))run(async()=>{reset();await IguanaLatex.load($('source'),'E=mc^{2}',api);IguanaLatex.selectBody($('source'));status('新公式将插入所选页。')})};
$('preview').onclick=()=>run(async()=>{status('正在编译 LaTeX…');await IguanaLatex.prepare($('source'),api);const d=await api('preview',payload());const im=new Image();im.alt='公式预览';im.src='data:image/png;base64,'+d.png;$('previewbox').replaceChildren(im);status('预览完成。点击“写入当前 PPTX”保存到当前编辑会话。')});
$('apply').onclick=()=>run(async()=>{status('正在编译并写入公式…');const page=Number($('slide').value);await IguanaLatex.prepare($('source'),api);const d=await api('apply',payload());refresh(d);await select(equations.find(e=>e.shape_id===d.selected&&e.slide===page));unsaved=true;status('公式已写入。请下载修改后的 PPTX，在 WPS / PowerPoint 中打开。')});
$('save').onclick=()=>run(async()=>{if(textDirty)throw Error('编辑区的修改尚未写入。请先点击“写入当前 PPTX”，再下载。');const d=await api('save');download(new Blob([from64(d.data)],{type:'application/vnd.openxmlformats-officedocument.presentationml.presentation'}),d.name);unsaved=false;status(`已下载 ${d.name}，已同步 ${d.count} 个公式的源码备份。`)});
$('sources').onclick=()=>run(async()=>{const d=await api('sources');download(new Blob([JSON.stringify(d,null,2)],{type:'application/json;charset=utf-8'}),d.name);status('已导出当前 PPTX 内的源码清单；可用文本编辑器打开和复制源码。')});
$('protect').onclick=()=>run(async()=>{const d=await api('protect');refresh(d);unsaved=true;status('已同步可读取的公式源码并恢复标签。请下载 PPTX。')});
$('doctor').onclick=()=>run(async()=>status(JSON.stringify(await api('doctor'),null,2)));
run(()=>IguanaLatex.prepare($('source'),api));
window.onbeforeunload=e=>{if(unsaved||textDirty){e.preventDefault();e.returnValue=''}};
</script><script src="/shared/workspace.js"></script></body></html>
