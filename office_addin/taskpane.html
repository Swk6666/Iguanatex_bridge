<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IguanaTex Bridge · PowerPoint</title><link rel="stylesheet" href="/shared/workspace.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="/shared/chat.css">
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script></head>
<body><header class="app-header"><span class="mark" aria-hidden="true">∑</span><h1>IguanaTex <span>Bridge</span></h1><span class="spacer"></span><button id="assistantToggle" aria-controls="assistantDock" aria-expanded="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l1.9 4.8 4.8 1.9-4.8 1.9L12 16.9l-1.9-4.8-4.8-1.9 4.8-1.9z"/><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>AI 助手</button></header>
<main class="editor-shell">
<div class="office-navigation"><button id="new" class="quiet"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>新建公式</button><button id="load" class="quiet"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>编辑选中公式</button></div>
<div class="editor-tools">
<label><span class="tool-label">字号</span><input id="pointSize" aria-label="字号（pt）" type="number" min="4" max="200" step="0.5" value="24"><span class="field-unit">pt</span></label>
<label><select id="engine" aria-label="编译引擎"><option value="xelatex">XeLaTeX</option><option value="pdflatex">pdfLaTeX</option><option value="lualatex">LuaLaTeX</option></select></label>
<label><select id="output" aria-label="输出格式"><option value="svg">SVG 矢量</option><option value="png">PNG 图片</option></select></label>
<span class="spacer"></span><details class="popover"><summary><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>更多</summary><div class="popover-content">
<label id="sizeModeLabel" hidden>更新尺寸<select id="sizeMode"><option value="font">按字号重设尺寸</option><option value="height">保留高度</option><option value="frame">固定原宽高 · 可能拉伸</option></select></label>
<p class="note">公式和源码一同保存。更新保留位置与所选宽高规则；旋转、翻转、动画和特效需重新设置。更新后请保存 PPTX。</p>
<details><summary>环境与兼容性 ⌄</summary><p class="note">图片公式需要 PowerPointApi 1.5；Shape 组合和层叠顺序需要 1.8。与原 IguanaTeX 互相读取源码、引擎及字号。Shape 更新为 SVG / PNG 后仍可再次编辑；逐字形状样式不保留。含其他对象的外层组合需先取消。</p><button id="doctor">检查本机 LaTeX</button><pre id="diagnostics"></pre><a href="/" target="_blank" rel="noopener">打开独立 PPTX 编辑器</a></details>
</div></details></div>
<div class="work-area"><div class="formula-pane"><div class="source-head"><label for="source">formula.tex</label><span class="source-caption">完整文档</span></div><div class="code-editor"><pre class="code-gutter" aria-hidden="true"></pre><textarea id="source" spellcheck="false" wrap="off" aria-label="完整 LaTeX 源码">E=mc^{2}</textarea></div>
<div class="pane-splitter" role="separator" aria-orientation="horizontal" aria-label="调整预览高度" title="拖动调整预览高度，双击恢复" tabindex="0"></div>
<div class="preview-pane"><div class="preview-head"><strong>预览</strong></div><div id="preview" class="preview-canvas"><img id="formulaImage" alt="公式预览" hidden><span id="previewHint">编译结果将在此处显示</span></div></div></div>
<aside id="assistantDock" class="assistant-dock" aria-label="AI 助手" hidden><div class="dock-heading"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l1.9 4.8 4.8 1.9-4.8 1.9L12 16.9l-1.9-4.8-4.8-1.9 4.8-1.9z"/><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>AI 助手 <span>DeepSeek</span><span class="spacer"></span><button id="assistantClose" class="quiet icon-button" aria-label="收起 AI 助手"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div id="chatPanel"></div></aside></div>
<div class="actionbar"><div id="status" role="status" aria-live="polite">正在连接 PowerPoint…</div><div class="actions"><button id="aiFix" class="ai-fix" type="button" title="把编译错误日志和当前源码发送给 AI 助手分析" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l1.9 4.8 4.8 1.9-4.8 1.9L12 16.9l-1.9-4.8-4.8-1.9 4.8-1.9z"/><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>发给 AI 分析</button><button id="previewButton"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg>预览</button><button id="apply" class="primary">插入当前幻灯片</button></div></div>
</main><script src="/shared/latex.js"></script><script src="/shared/chat.js"></script><script src="adapter.js"></script><script src="taskpane.js"></script><script src="/shared/workspace.js"></script></body></html>
